version: '3.8'

services:
  inovecloud-core:
    build: .
    container_name: inovecloud-core
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - inovecloud_data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000

  caddy:
    image: caddy:2-alpine
    container_name: inovecloud-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - inovecloud-core

volumes:
  inovecloud_data:
  caddy_data:
  caddy_config:
