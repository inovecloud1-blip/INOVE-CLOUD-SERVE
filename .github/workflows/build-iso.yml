name: Build InoveCloud OS Alpine ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-alpine-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install ISO Building Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools wget curl genisoimage syslinux syslinux-utils isolinux p7zip-full

      - name: Download Alpine Linux Virt Base ISO
        run: |
          ALPINE_VERSION="3.20.0"
          ISO_URL="https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-virt-${ALPINE_VERSION}-x86_64.iso"
          echo "Downloading Alpine ISO from ${ISO_URL}..."
          wget -O alpine-base.iso ${ISO_URL} || \
          wget -O alpine-base.iso https://dl-cdn.alpinelinux.org/alpine/v3.20.3/releases/x86_64/alpine-virt-3.20.3-x86_64.iso

      - name: Extract, Customize and Inject InoveCloud OS
        run: |
          mkdir -p iso_extract /tmp/bundle
          7z x alpine-base.iso -oiso_extract/

          # Bundle project files outside current tree to avoid tar file-changed warning errors
          tar --exclude='iso_extract' --exclude='.git' --exclude='alpine-base.iso' -czf /tmp/bundle/workspace.tar.gz .

          # Copy answer file and firstboot script
          cp alpine-iso/answers iso_extract/answers
          cp alpine-iso/firstboot.sh iso_extract/firstboot.sh
          cp /tmp/bundle/workspace.tar.gz iso_extract/workspace.tar.gz

          # Find MBR bin for hybrid boot
          MBR_BIN=""
          for p in /usr/lib/ISOLINUX/isohdpfx.bin /usr/share/syslinux/isohdpfx.bin; do
            if [ -f "$p" ]; then
              MBR_BIN="$p"
              break
            fi
          done

          # Rebuild ISO with hybrid boot configuration
          cd iso_extract
          if [ -n "$MBR_BIN" ]; then
            echo "Using MBR binary: $MBR_BIN"
            xorriso -as mkisofs \
              -r -V "INOVECLOUD_ALPINE" \
              -J -joliet-long -l \
              -b boot/syslinux/isolinux.bin \
              -c boot.cat \
              -no-emul-boot -boot-load-size 4 -boot-info-table \
              -isohybrid-mbr "$MBR_BIN" \
              -o ../inovecloud-alpine-os.iso .
          else
            echo "Building standard ISOLINUX ISO..."
            xorriso -as mkisofs \
              -r -V "INOVECLOUD_ALPINE" \
              -J -joliet-long -l \
              -b boot/syslinux/isolinux.bin \
              -c boot.cat \
              -no-emul-boot -boot-load-size 4 -boot-info-table \
              -o ../inovecloud-alpine-os.iso .
          fi

          cd ..
          isohybrid inovecloud-alpine-os.iso || true

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InoveCloud-OS-Alpine-x86_64
          path: inovecloud-alpine-os.iso
