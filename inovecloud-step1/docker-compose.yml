version: '3.8'

services:
  backend:
    build: ./backend
    container_name: inovecloud-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  frontend:
    build: ./frontend
    container_name: inovecloud-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
